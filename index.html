<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Root Cause — streaming diagnostics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --fg:#1c1c1a; --muted:#6b6b66; --line:#e5e3dc; --accent:#d85a30; --bg:#faf9f5; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--fg); background: var(--bg); line-height:1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .tag { color: var(--muted); margin: 0 0 24px; }
  .bar { display:flex; gap:10px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
                     font-size:15px; background:var(--card); color:var(--fg); }
  button { padding:12px 20px; border:none; border-radius:10px; background:var(--accent); color:#fff;
           font-size:15px; font-weight:500; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .hint { color: var(--muted); font-size:13px; margin-top:10px; }
  .hint code { background:#efece4; padding:1px 5px; border-radius:4px; cursor:pointer; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-top:22px; }
  .report h1,.report h2,.report h3 { font-size:17px; margin:16px 0 6px; }
  .report p { margin:8px 0; }
  .status { color: var(--muted); font-size:14px; margin-top:22px; }
  .kpis { display:flex; flex-wrap:wrap; gap:16px; margin:4px 0 8px; }
  .kpi { flex:1 1 160px; }
  .kpi .n { font-size:22px; font-weight:600; }
  .kpi .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .err { color:#a32d2d; }
  footer { color:var(--muted); font-size:12px; margin-top:32px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Root Cause</h1>
  <p class="tag">Describe a streaming incident in plain English. The agent investigates the playback data and returns the culprit.</p>

  <div class="bar">
    <input id="incident" type="text" placeholder="e.g. Rebuffering spiked last night in the Southeast"
           value="Rebuffering spiked last night in the Southeast" />
    <button id="go">Diagnose</button>
  </div>
  <div class="hint">Try:
    <code class="ex">Rebuffering spiked last night in the Southeast</code>
    <code class="ex">Playback quality dropped for Smart TV users</code>
  </div>

  <div id="status" class="status" style="display:none"></div>

  <div id="results" style="display:none">
    <div class="card">
      <div class="kpis" id="kpis"></div>
      <canvas id="chart" height="150"></canvas>
    </div>
    <div class="card report" id="report"></div>
  </div>

  <footer>Powered by Gemini on Google Cloud (Vertex AI) · data on ClickHouse.</footer>
</div>

<script>
let chart = null;
const $ = (id) => document.getElementById(id);

document.querySelectorAll('.ex').forEach(el =>
  el.addEventListener('click', () => { $('incident').value = el.textContent; run(); }));
$('go').addEventListener('click', run);
$('incident').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

async function run() {
  const incident = $('incident').value.trim();
  if (!incident) return;
  $('go').disabled = true;
  $('results').style.display = 'none';
  setStatus('Investigating — confirming the anomaly, decomposing across dimensions, drilling in…');

  try {
    const res = await fetch('/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ incident })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    render(data);
    setStatus('');
  } catch (e) {
    setStatus('Error: ' + e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function setStatus(msg, isErr) {
  const s = $('status');
  if (!msg) { s.style.display = 'none'; return; }
  s.style.display = 'block';
  s.textContent = msg;
  s.className = 'status' + (isErr ? ' err' : '');
}

function pct(x) { return (x * 100).toFixed(1) + '%'; }

function render(data) {
  const f = data.findings;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="n">${pct(f.incident_rate)}</div><div class="l">Incident rate</div></div>
    <div class="kpi"><div class="n">${pct(f.baseline_rate)}</div><div class="l">Baseline</div></div>
    <div class="kpi"><div class="n">${f.rate_multiple ?? '—'}×</div><div class="l">Above baseline</div></div>
    <div class="kpi"><div class="n">${Number(f.incident_sessions).toLocaleString()}</div><div class="l">Sessions</div></div>`;
  $('report').innerHTML = marked.parse(data.report || '');
  drawChart(data.chart);
  $('results').style.display = 'block';
}

function drawChart(c) {
  const labels = (c.labels || []).map(s => s.slice(5, 16));
  if (chart) chart.destroy();
  chart = new Chart($('chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Culprit segment', data: c.culprit, borderColor: '#d85a30', backgroundColor: 'transparent', tension: .3, pointRadius: 0 },
        { label: 'Overall', data: c.overall, borderColor: '#9c9a92', backgroundColor: 'transparent', tension: .3, pointRadius: 0 }
      ]
    },
    options: {
      plugins: { legend: { position: 'bottom' }, title: { display: true, text: 'Rebuffer rate over the last 24h' } },
      scales: { y: { ticks: { callback: v => (v * 100).toFixed(0) + '%' }, beginAtZero: true } }
    }
  });
}
</script>
</body>
</html>
